name: Fair Line update

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fair-line-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Update the data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: node update.mjs

      - name: Save the data
        run: |
          git config user.name "fair-line-bot"
          git config user.email "fair-line-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
